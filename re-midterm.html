<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creativity Festival</title>
  <script src="https://cdn.tailwindcs.com"></script>
</head>
<body>
    <header>
        <h1>Student Creativity Festival</h1>
        <p>Showcase Your Creativity, Skills and Innovative Ideas</p>
    </header>
    <main>
        <section>
            <form action="#" method="#">
                <label for="name">Student Name</label>
                <input type="text" id="name" 
                placeholder="Enter your full name"><br>

                <label for="class" id="class">Class</label>
                <select>
                    <option>X</option>
                    <option>XI</option>
                    <option>XII</option>
                </select><br>

                <!-- Label for the Question -->
                <label for="gender" id="gender">Gender</label><br> 
                
                <input type="radio" id="male">
                <!-- Label for the answer, in radio buttons -->
                 <label for="male" id="male">Male</label><br>

                 <input type="radio" id="female">
                <!-- Label for the answer, in radio buttons -->
                 <label for="female" id="female">Female</label><br>


                 <label for="category" id="cat">Competition Category</label>
                <select>
                    <option>Web Development</option>
                    <option>IoT Project</option>
                    <option>Graphic Design</option>
                    <option>Public Speaking</option>
                    <option>Photography</option>
                </select><br>

                <!-- Label for the Question || Participation Type -->
                <label for="part-type" id="part-type">Participation Type</label><br> 
                
                <input type="radio" id="Indi">
                <!-- Label for the answer, in radio buttons -->
                 <label for="Indi" id="Indi">Individual</label><br>

                 <input type="radio" id="team">
                <!-- Label for the answer, in radio buttons -->
                 <label for="team" id="team">Team</label><br>


                <label for="team-name">Team Name</label>
                <input type="text" id="team-name" 
                placeholder="Enter your team's name"><br>

                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" 
                placeholder="08xxxxxx"><br>

                <label for="desc">Project Description</label>
                <textarea id="desc" name="desc" 
                placeholder="Describe your project or competition entry..."></textarea><br>

                <button type="submit">
                    Register Now
                </button>

            </form>
        </section>

        <section>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Participant</th>
                        <th>Class</th>
                        <th>Category</th>
                        <th>Team</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Tony Stark</td>
                        <td>XII</td>
                        <td>IoT Project</td>
                        <td>Stark Industries</td>
                        <td>Registered</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Steve Roger</td>
                        <td>XII</td>
                        <td>Public Speaking</td>
                        <td>Avengers</td>
                        <td>Registered</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
